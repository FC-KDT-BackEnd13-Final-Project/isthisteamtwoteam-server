spring:
  application:
    name: isThisTeamTwoTeam

  datasource:
    url: jdbc:postgresql://localhost:5432/bnDB
    username: user
    password: 12345678
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui


logging:
  level:
    root: INFO
    org.etmetmy.bn_server: DEBUG
    org.etmetmy.bn_server.exception: ERROR
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

