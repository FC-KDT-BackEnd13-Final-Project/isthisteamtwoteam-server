name: "🐛 Bug"
description: "버그 제보"
title: "[Bug] "
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: 📄 버그 설명
      description: 어떤 버그가 발생했는지 설명해 주세요.
      placeholder: 발생한 버그에 대해 자세히 작성해주세요.
    validations:
      required: true
      
  - type: textarea
    id: reproduce
    attributes:
      label: 🔄 재현 방법
      description: 버그를 재현할 수 있는 단계를 작성해 주세요.
      placeholder: |
        1. '...'로 이동
        2. '...'를 클릭
        3. '...'까지 스크롤
        4. 버그 발생
    validations:
      required: true
      
  - type: textarea
    id: expected
    attributes:
      label: ✅ 예상 동작
      description: 어떻게 동작해야 하는지 작성해 주세요.
      placeholder: 정상적으로 동작했을 때의 모습
    validations:
      required: true
      
  - type: textarea
    id: actual
    attributes:
      label: ❌ 실제 동작
      description: 실제로 어떻게 동작하는지 작성해 주세요.
      placeholder: 현재 발생하는 버그의 모습
    validations:
      required: true
      
  - type: textarea
    id: screenshots
    attributes:
      label: 📸 스크린샷
      description: 스크린샷이나 에러 로그가 있다면 첨부해 주세요.
      placeholder: 이미지를 드래그하거나 붙여넣기 해주세요.
    validations:
      required: false
      
  - type: textarea
    id: environment
    attributes:
      label: 🌍 환경 정보
      description: 버그가 발생한 환경을 작성해 주세요.
      placeholder: |
        - OS: [예: Windows 11, macOS 14]
        - 브라우저: [예: Chrome 120, Safari 17]
        - 버전: [예: v1.2.3]
    validations:
      required: false
