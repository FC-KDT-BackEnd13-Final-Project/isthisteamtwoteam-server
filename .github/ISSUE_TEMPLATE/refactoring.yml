name: "♻️ Refactoring"
description: "코드 리팩토링"
title: "[Refactoring] "
labels: ["refactoring"]
body:
  - type: textarea
    id: description
    attributes:
      label: 📄 리팩토링 설명
      description: 어떤 부분을 리팩토링할 것인지 설명해 주세요.
      placeholder: 리팩토링이 필요한 이유와 개선할 부분을 작성해주세요.
    validations:
      required: true
      
  - type: textarea
    id: current
    attributes:
      label: 🔴 현재 상태
      description: 현재 코드의 문제점이나 개선이 필요한 부분을 작성해 주세요.
      placeholder: |
        - 코드 중복
        - 복잡한 로직
        - 성능 이슈 등
    validations:
      required: true
      
  - type: textarea
    id: expected
    attributes:
      label: 🟢 개선 방향
      description: 어떻게 개선할 것인지 작성해 주세요.
      placeholder: 리팩토링 후 기대되는 결과를 작성해주세요.
    validations:
      required: true
      
  - type: textarea
    id: tasks
    attributes:
      label: ✅ 작업할 내용
      description: 할 일을 체크박스 형태로 작성해주세요.
      placeholder: |
        - [ ] 첫 번째 작업
        - [ ] 두 번째 작업
        - [ ] 세 번째 작업
    validations:
      required: true
      
  - type: textarea
    id: references
    attributes:
      label: 🙋🏻 참고 자료
      description: 참고 자료가 있다면 작성해 주세요.
      placeholder: 링크, 문서, 관련 이슈 등
    validations:
      required: false
